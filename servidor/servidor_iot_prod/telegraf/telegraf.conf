[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers   = ["tcp://mosquitto:1883"]
  topics    = ["utec/gemelo/+/+/co2", "utec/gemelo/+/+/audio"]
  qos       = 0
  client_id = "telegraf"
  username  = "${MQTT_USER}"
  password  = "${MQTT_PASS}"

  data_format        = "json"
  json_name_key      = "tipo"
  tag_keys           = ["nodo", "mac"]
  json_string_fields = ["nivel", "anomalias"]
  json_time_key      = "ts"
  json_time_format   = "unix_ms"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "utec/gemelo/+/+/+"
    tags  = "_/_/grupo/_/_"

[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUX_TOKEN}"
  organization = "utec"
  bucket       = "gemelo"
