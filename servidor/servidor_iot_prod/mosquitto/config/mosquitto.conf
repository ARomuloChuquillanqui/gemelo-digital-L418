# Todas las conexiones requieren usuario y contraseña
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Listener interno (solo red de Docker, no publicado): Telegraf
listener 1883

# Listener externo con TLS: gateways ESP32
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
log_dest stdout
