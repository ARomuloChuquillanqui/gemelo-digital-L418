# Grafana crea esta fuente de datos automáticamente al iniciar
apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: utec
      defaultBucket: gemelo
    secureJsonData:
      token: $INFLUX_TOKEN
