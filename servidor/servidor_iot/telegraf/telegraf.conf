[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# ---------- ENTRADA: suscripción a MQTT ----------
[[inputs.mqtt_consumer]]
  servers   = ["tcp://mosquitto:1883"]
  topics    = ["utec/gemelo/+/+/co2", "utec/gemelo/+/+/audio", "utec/gemelo/+/+/termico", "utec/gemelo/+/+/magnetico", "utec/gemelo/+/+/ambiente", "utec/gemelo/+/+/luz", "utec/gemelo/+/+/gas"]
  qos       = 0
  client_id = "telegraf"

  data_format        = "json"
  json_name_key      = "tipo"                    # measurement: co2 / audio
  tag_keys           = ["nodo", "mac"]           # etiquetas para filtrar
  json_string_fields = ["nivel", "anomalias"]    # campos de texto
  json_time_key      = "ts"                      # usar la hora del gateway
  json_time_format   = "unix_ms"

  # utec/gemelo/<grupo>/<nodo>/<tipo>  ->  etiqueta "grupo"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "utec/gemelo/+/+/+"
    tags  = "_/_/grupo/_/_"

# ---------- SALIDA: InfluxDB ----------
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUX_TOKEN}"
  organization = "utec"
  bucket       = "gemelo"
